name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Parse every YAML file
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml

          failed = False
          for path in sorted(pathlib.Path(".").rglob("*.yml")):
              if ".git" in path.parts:
                  continue
              try:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except yaml.YAMLError as exc:
                  failed = True
                  print(f"FAIL {path}: {exc}")
              else:
                  print(f"ok   {path}")
          sys.exit(1 if failed else 0)
          PY

      - name: Validate the component templates
        run: python3 scripts/validate-templates.py

      - name: Check version pinning, input wiring and docs
        run: bash scripts/check-sync.sh

      - name: Check the examples against the templates
        run: python3 scripts/check-examples.py

      # No GitLab and no scanner image involved: each template is rendered and
      # its job script run against a stand-in ark-tools that records what it
      # was called with.
      - name: Test the jobs the templates generate
        run: python3 tests/templates.test.py

      - name: ShellCheck
        run: shellcheck -s bash scripts/*.sh

      # The script blocks inside the templates are shell too, and they run in
      # every consuming pipeline. sh, not bash: nothing in them may depend on
      # the shell a runner happens to pick.
      - name: ShellCheck the job scripts
        run: |
          python3 tests/templates.test.py --dump "$RUNNER_TEMP/job-scripts"
          shellcheck -s sh "$RUNNER_TEMP"/job-scripts/*.sh

      # Pinned by digest: a third-party image runs with this job's context, and
      # a mutable tag would let it change without a commit here. This is
      # rhysd/actionlint:1.7.12.
      - name: Actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  self-scan:
    name: Self scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          # Betterleaks walks the git history; a shallow clone hides most of it.
          fetch-depth: 0

      # This repository lives on GitHub, so it is scanned by the GitHub front
      # end of the same scanner: the sister Action, which runs the same image
      # and the same ark-tools commands as the templates here.
      - name: Scan this repository for secrets
        uses: Tooark/action-security-scanner@v1.2.0
        with:
          command: secret-scan
          artifact-name: self-scan-reports

      - name: Scan this repository for vulnerable dependencies
        uses: Tooark/action-security-scanner@v1.2.0
        with:
          command: filesystem-scan
          trivy-severity: CRITICAL,HIGH
          artifact-name: self-scan-fs-reports
