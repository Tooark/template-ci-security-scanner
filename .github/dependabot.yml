# Keeps the actions referenced by this repository's own workflows current,
# including the sister Action the self-scan job runs. Without this, pinning a
# version would quietly freeze a dependency instead of controlling it.
version: 2

updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows/.
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
