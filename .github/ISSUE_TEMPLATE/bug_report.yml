name: 🐛 Bug report
description: Report a defect in the GitLab templates or the catalog mirror.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.
        For **security vulnerabilities**, do NOT file a public issue — see [`SECURITY.md`](https://github.com/Tooark/template-security-scanner/blob/main/SECURITY.md).
        Using **GitHub Actions**? The Action lives in [`Tooark/action-security-scanner`](https://github.com/Tooark/action-security-scanner/issues/new/choose).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am pinning a released tag, not `main`.
          required: true
        - label: This is not a security vulnerability (those go through the private channel).
          required: true
        - label: This is a defect in the component, not a finding the scanner reported in my own code.
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: How are you consuming it?
      options:
        - Remote include (include:remote)
        - CI/CD Catalog component (include:component)
        - Local copy of the templates (include:local)
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which template?
      options:
        - full-scan
        - image-scan
        - filesystem-scan
        - config-scan
        - repo-scan
        - dockerfile-lint
        - secret-scan
        - Not template-specific (catalog mirror, release, docs, tooling)
    validations:
      required: true

  - type: input
    id: component-version
    attributes:
      label: Component version
      description: The tag you pinned.
      placeholder: "e.g., v1.0.0"
    validations:
      required: true

  - type: input
    id: scanner-version
    attributes:
      label: Scanner image tag
      description: Leave the default unless you overrode scanner_version.
      placeholder: "e.g., ghcr.io/tooark/security-scanner:1.10"
    validations:
      required: true

  - type: input
    id: gitlab-version
    attributes:
      label: GitLab version
      description: gitlab.com, or the version of your instance (Help > Help).
      placeholder: "e.g., gitlab.com, or 18.2 self-managed"
    validations:
      required: true

  - type: dropdown
    id: runner
    attributes:
      label: Runner
      description: Self-hosted runners are where image-scan and caching behave differently.
      options:
        - GitLab.com hosted runner
        - Self-hosted — docker executor
        - Self-hosted — kubernetes executor
        - Self-hosted — other executor
    validations:
      required: true

  - type: textarea
    id: snippet
    attributes:
      label: Pipeline snippet
      description: The include that reproduces the problem, with the inputs you set, and any override of the generated job.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        The job log around the failure. **Redact credentials, tokens and any detected secret** —
        a scan log can quote the finding that tripped the gate.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: CI/CD variables set on the project or group, a custom reports_dir, a proxy, an air-gapped instance, etc.
