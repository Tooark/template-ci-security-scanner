# =============================================================================
# A complete setup with `include: remote:`: build the image, scan everything on
# the default branch, and give merge requests a fast secrets-only job.
# -----------------------------------------------------------------------------
# Works on gitlab.com and on any self-hosted instance that can reach
# raw.githubusercontent.com. No catalog needed.
#
# Always pin a tag. Pointing at `main` means a pipeline can change under you.
# =============================================================================
stages:
  - build
  - security

variables:
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"

include:
  # ---------------------------------------------------------------------------
  # Everything at once: image + source + secrets + Dockerfile lint.
  # ---------------------------------------------------------------------------
  - remote: "https://raw.githubusercontent.com/Tooark/template-security-scanner/v1.3.0/templates/full-scan.yml"
    inputs:
      stage: security
      image: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      trivy_severity: "CRITICAL,HIGH"
      trivy_severity_fail: "CRITICAL"
      hadolint_failure_level: "warning"
      dockerfiles: "Dockerfile,docker/Dockerfile.worker"
      # sbom is a boolean input, so it takes a bare true; the string-typed
      # toggles, such as no_git below, take a quoted "true".
      sbom: true

  # ---------------------------------------------------------------------------
  # A second, faster job that runs on merge requests only: secrets, no image.
  # A different job_name is what lets a template be included more than once.
  # ---------------------------------------------------------------------------
  - remote: "https://raw.githubusercontent.com/Tooark/template-security-scanner/v1.3.0/templates/secret-scan.yml"
    inputs:
      job_name: "security:secrets-mr"
      stage: security
      no_git: "true"
      rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# -----------------------------------------------------------------------------
# The generated jobs are ordinary jobs: override anything the inputs do not
# expose by redeclaring the job name.
# -----------------------------------------------------------------------------
"security:full-scan":
  needs: ["build"]
  variables:
    # The image sits in this project's registry, which is private unless the
    # project is public. Trivy reads both variables natively, and the job token
    # behind CI_REGISTRY_PASSWORD is allowed to pull.
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    # Any environment variable from the image README works here. Inputs win
    # over these, so leave the matching input empty when you set one.
    TRIVY_SCANNERS: "vuln,secret,misconfig,license"
    BETTERLEAKS_REDACT: "80"
